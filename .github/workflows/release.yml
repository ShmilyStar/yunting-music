  Release:
    name: Release
    runs-on: ubuntu-latest
    needs: [CheckVersion, Android, iOS]
    # 两个构建并行跑，任一失败也要发布另一边已构建成功的产物，
    # 所以用 always() 而不是默认的「全部成功」。版本检查没过才真的跳过。
    if: |
      always() && needs.CheckVersion.outputs.should_run == 'true' &&
      (needs.Android.result == 'success' || needs.iOS.result == 'success')
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh ./artifacts

      - name: Generate file MD5
        run: |
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          cd artifacts
          # 只对真实存在的产物做校验（某个平台构建失败时不会有对应文件）
          shopt -s nullglob
          FILES=(*.apk *.ipa)
          if [ ${#FILES[@]} -gt 0 ]; then
            md5sum "${FILES[@]}" >> ../publish/changeLog.md
          else
            echo '(no artifacts)' >> ../publish/changeLog.md
          fi
          echo -e '```\n' >> ../publish/changeLog.md
          echo -e '\n本仓库签名与上游不同，从上游版本覆盖安装需先卸载。\n' >> ../publish/changeLog.md

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: false
          draft: false
          # Release 已存在时（补传产物 / 重跑）覆盖同名附件，而不是报错
          fail_on_unmatched_files: false
          tag_name: v${{ env.PACKAGE_VERSION }}
          # 用通配符收集：某个平台构建失败时，另一边仍能正常发布
          files: |
            artifacts/*.apk
            artifacts/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
