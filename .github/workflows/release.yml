name: Build & Release

# 发布唯一入口：**推送代码即可**，不再需要本地构建。
#
# 触发：
#   - push 到 main 且 package.json 的版本号还没有对应 tag → 自动构建并发布
#   - 手动触发（可选传入版本号，或在版本号已发过时强制重建）
#
# 做的事：
#   1. Android：构建 5 个 ABI 的 APK
#   2. iOS：在 macOS 上构建未签名 IPA
#   3. 两者都完成后，创建/更新 vX.Y.Z 的 Release 并上传全部产物
#
# 关于签名：本仓库没有 keystore.properties 也没有 keystore Secrets，
# android/app/build.gradle 会回退到 app/debug.keystore 签名（与历次发布一致，
# 老用户可覆盖安装）。要换成正式 keystore，再配置 4 个 Secrets 即可，无需改本文件。
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force:
        description: '版本号已发布过时仍然重建（true/false）'
        required: false
        default: 'false'

permissions:
  # 推 tag、创建 Release、上传产物都需要写权限
  contents: write

jobs:
  CheckVersion:
    name: CheckVersion
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether version tag exists
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

          if git tag -l "v${PACKAGE_VERSION}" | grep -q .; then
            # 版本号已经发过：只有手动触发并勾了 force 才重建，避免每次 push 都重复发版
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
              echo "Tag v${PACKAGE_VERSION} exists but force=true, rebuild"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
            else
              echo "Tag v${PACKAGE_VERSION} already exists, skip（发新版请先改 package.json 的版本号）"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Tag v${PACKAGE_VERSION} not found, will build and release"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  Android:
    name: Android
    runs-on: ubuntu-latest
    needs: [CheckVersion]
    if: needs.CheckVersion.outputs.should_run == 'true'
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Env
        uses: ./.github/actions/setup

      - name: Build Packages
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          cd android

          # gradlew 在仓库里是 100644（Windows 提交时丢了可执行位），
          # 直接 ./gradlew 会报 "Permission denied"（exit 126）。
          # 这里就地补权限，并对 CRLF 做一次兜底处理，避免 checkout 转换踩坑。
          chmod +x gradlew
          sed -i 's/\r$//' gradlew

          # 有 keystore Secrets 就用正式签名；没有则直接用 debug.keystore
          # （build.gradle 的 signingConfigs.release 会自动回退，这里无需任何参数）。
          if [ -n "${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}" ]; then
            echo "使用仓库 Secrets 中的 keystore"
            echo '${{ secrets.KEYSTORE_STORE_FILE_BASE64 }}' | base64 --decode > "app/${{ secrets.KEYSTORE_STORE_FILE }}"
            ./gradlew assembleRelease \
              -PMYAPP_UPLOAD_STORE_FILE='${{ secrets.KEYSTORE_STORE_FILE }}' \
              -PMYAPP_UPLOAD_KEY_ALIAS='${{ secrets.KEYSTORE_KEY_ALIAS }}' \
              -PMYAPP_UPLOAD_STORE_PASSWORD='${{ secrets.KEYSTORE_PASSWORD }}' \
              -PMYAPP_UPLOAD_KEY_PASSWORD='${{ secrets.KEYSTORE_KEY_PASSWORD }}'
            rm -f "app/${{ secrets.KEYSTORE_STORE_FILE }}"
          else
            echo "未配置 keystore Secrets，使用 app/debug.keystore 签名（与历史发布一致）"
            ./gradlew assembleRelease
          fi

      # Push tag to GitHub if package.json version's tag is not tagged
      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Create git tag
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

  iOS:
    name: iOS
    runs-on: macos-15
    needs: [CheckVersion]
    if: needs.CheckVersion.outputs.should_run == 'true'
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 安装 JS 依赖
        run: npm ci

      - name: pod install（关 Flipper）
        working-directory: ios
        env:
          NO_FLIPPER: '1'
        run: pod install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios

      - name: 构建 lxcore staticlib（iOS）
        run: bash rust/build-ios-libs.sh

      # IPA 的 CFBundleShortVersionString / CFBundleVersion 取的是这里传下去的构建参数。
      # 早先只在 project.pbxproj 里写死（1.0.6），升级版本号时忘了改，签名工具里就显示旧版本。
      # 现在一律由 package.json 决定，pbxproj 里的值只是本地直接构建时的兜底。
      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
          echo "BUILD_NUMBER=${PACKAGE_VERSION##*.}" >> $GITHUB_ENV

      - name: unsigned 构建（设备）
        working-directory: ios
        run: >
          xcodebuild
          -workspace LxMusicMobile.xcworkspace
          -scheme LxMusicMobile
          -configuration Release
          -sdk iphoneos
          -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO
          COMPILER_INDEX_STORE_ENABLE=NO
          MARKETING_VERSION="$PACKAGE_VERSION"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER"
          build

      - name: 校验 IPA 版本号
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          PLIST="LxMusicMobile.app/Info.plist"
          SHORT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST")
          echo "IPA version: $SHORT ($BUILD), package.json: $PACKAGE_VERSION"
          if [ "$SHORT" != "$PACKAGE_VERSION" ]; then
            echo "::error::IPA 版本号与 package.json 不一致（$SHORT != $PACKAGE_VERSION）"
            exit 1
          fi

      - name: 打包 IPA
        working-directory: ios/build/Build/Products/Release-iphoneos
        run: |
          rm -rf Payload
          mkdir -p Payload
          # 用 ditto 而不是 cp -r：完整保留符号链接与资源分叉，与 macOS 系统打包一致。
          # 第三方签名工具对 cp -r 打出的 symlink 支持不好，容易报「解压失败」。
          ditto LxMusicMobile.app Payload/LxMusicMobile.app
          NAME="yunting-music-v${{ env.PACKAGE_VERSION }}-unsigned.ipa"
          # -y 保留符号链接为链接（framework 所必需）
          zip -qry "$NAME" Payload
          ls -lh "$NAME"
          unzip -l "$NAME" | head -20

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-v${{ env.PACKAGE_VERSION }}-unsigned-ipa
          path: ios/build/Build/Products/Release-iphoneos/yunting-music-v${{ env.PACKAGE_VERSION }}-unsigned.ipa

  Release:
    name: Release
    runs-on: ubuntu-latest
    needs: [CheckVersion, Android, iOS]
    # 两个构建并行跑，任一失败也要发布另一边已构建成功的产物，
    # 所以用 always() 而不是默认的「全部成功」。版本检查没过才真的跳过。
    if: |
      always() && needs.CheckVersion.outputs.should_run == 'true' &&
      (needs.Android.result == 'success' || needs.iOS.result == 'success')
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: List downloaded artifacts
        run: ls -lh ./artifacts

      - name: Generate file MD5
        run: |
          echo -e '\n### File MD5\n```' >> ./publish/changeLog.md
          # 发布说明只写本版本内容：不要追加「签名与上游不同」之类的固定提示（用户 2026-10-31 指定）
          cd artifacts
          # 只对真实存在的产物做校验（某个平台构建失败时不会有对应文件）
          shopt -s nullglob
          FILES=(*.apk *.ipa)
          if [ ${#FILES[@]} -gt 0 ]; then
            md5sum "${FILES[@]}" >> ../publish/changeLog.md
          else
            echo '(no artifacts)' >> ../publish/changeLog.md
          fi
          echo -e '```\n' >> ../publish/changeLog.md

      - name: Get package version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ./publish/changeLog.md
          prerelease: false
          draft: false
          # Release 已存在时（补传产物 / 重跑）覆盖同名附件，而不是报错
          fail_on_unmatched_files: false
          tag_name: v${{ env.PACKAGE_VERSION }}
          # 用通配符收集：某个平台构建失败时，另一边仍能正常发布
          files: |
            artifacts/*.apk
            artifacts/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 发布完成后触发 CNB 同步流水线（用户 2026-10-31 指定的新更新源）：
  # CNB 构建机从本仓库的 Release 拉 5 个 APK + IPA，发布成 CNB 自己的发行版
  # （tag vX.Y.Z），并把 version.json 覆盖到 latest 发行版。
  #
  # CNB 侧流水线定义在 cnb.cool/shmilystar/yunting-music 的 .cnb.yml（api_trigger 事件），
  # 这里只负责触发并等待结果；同步失败要让本次发版失败，避免「GitHub 发了、CNB 没有」。
  NotifyCNB:
    name: Sync to CNB
    needs: [CheckVersion, Release]
    if: needs.Release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger CNB pipeline
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          VERSION: ${{ needs.CheckVersion.outputs.version }}
        run: |
          set -eu
          if [ -z "${CNB_TOKEN:-}" ]; then
            echo "::error::CNB_TOKEN secret 未配置，无法同步到 CNB"
            exit 1
          fi
          API=https://api.cnb.cool
          SLUG=shmilystar/yunting-music
          AUTH="Authorization: Bearer $CNB_TOKEN"
          ACC="Accept: application/vnd.cnb.api+json"

          payload=$(jq -nc --arg tag "v$VERSION" \
            '{branch:"main",event:"api_trigger",env:{RELEASE_TAG:$tag},title:("sync "+$tag)}')
          resp=$(curl -sS -X POST "$API/$SLUG/-/build/start" -H "$AUTH" -H "$ACC" \
            -H "Content-Type: application/json" -d "$payload")
          echo "$resp"
          sn=$(echo "$resp" | jq -r '.sn // empty')
          if [ -z "$sn" ]; then
            echo "::error::CNB 未返回构建号"
            exit 1
          fi
          echo "CNB build: https://cnb.cool/$SLUG/-/build/logs/$sn" >> "$GITHUB_STEP_SUMMARY"

          # 等待同步流水线跑完（最多 30 分钟）；失败直接让本次发版失败
          for _ in $(seq 1 90); do
            sleep 20
            st=$(curl -sS "$API/$SLUG/-/build/status/$sn" -H "$AUTH" -H "$ACC" | jq -r '.status // "?"')
            echo "cnb status: $st"
            case "$st" in
              success) echo "CNB 同步完成" >> "$GITHUB_STEP_SUMMARY"; exit 0 ;;
              error|failed) echo "::error::CNB 同步失败：https://cnb.cool/$SLUG/-/build/logs/$sn"; exit 1 ;;
            esac
          done
          echo "::error::CNB 同步超时：https://cnb.cool/$SLUG/-/build/logs/$sn"
          exit 1
