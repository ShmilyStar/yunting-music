name: Sync to Gitee

# 把本仓库的 main 自动同步到 Gitee 镜像仓库（ShmilyStar/yunting-music）。
#
# 为什么用 Actions 而不是 Gitee 自带的「Pull Mirror」：Gitee 的仓库镜像
# 属于付费功能，免费账户用不了。这里在 GitHub 侧主动推送，效果等价且免费。
#
# 关于令牌：Gitee 令牌与 GitHub 令牌互不相通，本仓库是公开仓库，
# 因此把 Gitee 的推送令牌直接放在本文件里（它只能写 gitee 上的这个仓库）。
# 若日后想收紧权限，可改为仓库 Secret：Settings → Secrets and variables
# → Actions 新建 GITEE_TOKEN，然后把下面的赋值改成
#   GITEE_TOKEN="${{ secrets.GITEE_TOKEN }}"
#
# 触发条件：
#   - main 分支有推送时自动同步
#   - 手动触发（workflow_dispatch）可随时补同步
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    name: Mirror main to Gitee
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v7
        with:
          # 镜像需要完整历史与标签，浅克隆会让 Gitee 侧历史断裂
          fetch-depth: 0

      - name: Push to Gitee
        env:
          GITEE_TOKEN: de6b2925e6be723c4a5a73476851a4d1
          GITEE_REPO: ShmilyStar/yunting-music
        run: |
          # 令牌打码，避免出现在 Actions 日志里
          echo "::add-mask::$GITEE_TOKEN"
          git remote add gitee "https://ShmilyStar:${GITEE_TOKEN}@gitee.com/${GITEE_REPO}.git"

          # 强制推 main：GitHub 是唯一写入源，Gitee 只作镜像。
          # 本仓库历史上出现过重写，不加 force 会在 Gitee 侧分叉后直接失败。
          git push gitee HEAD:refs/heads/main --force

          # 标签（版本发布用）也一起同步
          git push gitee --tags --force

          echo "已同步到 Gitee: https://gitee.com/${GITEE_REPO}"
