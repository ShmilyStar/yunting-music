name: Notify MySync

# 新版本发布后，通知私密仓库 ShmilyStar/MySync 去同步 Gitee：
#   1. 在 Gitee 上只保留 publish/version.json，清掉所有代码；
#   2. 把本仓库该版本的 APK/IPA 上传到 Gitee 发行版；
#   3. 删除 Gitee 上的旧版本发行版，只留最新一个。
#
# 同步逻辑本身放在 MySync（私密仓库）里，令牌也只存在那边，
# 本公开仓库不出现任何令牌。
#
# 触发：发布 Release 时（本仓库发版流程会创建 Release）
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: '要同步的版本号，例如 1.0.5（不含 v）'
        required: true

jobs:
  notify:
    name: Dispatch to MySync
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Release 触发时 tag 形如 v1.0.5，去掉前缀
          VERSION="${RELEASE_TAG#v}"
          VERSION="${VERSION:-$INPUT_VERSION}"
          if [ -z "$VERSION" ]; then
            echo "::error::没有拿到版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "通知 MySync 同步版本：$VERSION"

      - name: repository_dispatch to MySync
        env:
          # 只在触发 MySync 的 Actions 时需要；没有配置 Secret 就跳过，
          # 不影响发版本身（可事后在 MySync 里手动触发同步）。
          SYNC_TOKEN: ${{ secrets.MYSYNC_DISPATCH_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::未配置 MYSYNC_DISPATCH_TOKEN，跳过自动同步；可在 MySync 仓库手动触发"
            exit 0
          fi
          echo "::add-mask::$SYNC_TOKEN"
          curl -sS -X POST \
            -H "Authorization: token ${SYNC_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: yunting-release-notifier" \
            "https://api.github.com/repos/ShmilyStar/MySync/dispatches" \
            -d "$(printf '{"event_type":"yunting-release","client_payload":{"version":"%s"}}' "$VERSION")"
          echo "已通知 MySync 同步 v${VERSION}"
