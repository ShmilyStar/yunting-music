name: Notify MySync

# 新版本发布后，通知私密仓库 ShmilyStar/MySync 去同步 Gitee：
#   1. 先把本版本 APK/IPA 全部上传到 Gitee 发行版；
#   2. 再删掉 Gitee 上除最新外的旧发行版（只保留最新）；
#   3. 最后才更新 Gitee 的 publish/version.json。
#
# 同步逻辑和写 Gitee 的令牌都在私密仓库 MySync 里。
# 本仓库只需要一个 Secret：`MYSYNC`（能访问 MySync 的 GitHub PAT，仅用于发通知）。
#
# 为什么由发布流程**主动**通知，而不是监听 release 事件：
#   GitHub 有一条规则——用 Actions 自带的 GITHUB_TOKEN 创建的 Release
#   不会触发 release 事件类的工作流（防递归）。所以 `on: release` 在本仓库
#   永远不会被触发，只能由 release.yml 在 Release 完成后直接调用本工作流。
on:
  workflow_call:
    inputs:
      version:
        description: '要同步的版本号（不含 v）'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: '要同步的版本号，例如 1.0.6（不含 v）；留空则取最新 Release'
        required: false

jobs:
  notify:
    name: Dispatch to MySync
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sSL -H "User-Agent: notify" \
              "https://api.github.com/repos/${{ github.repository }}/releases/latest" \
              | jq -r '.tag_name' | sed 's/^v//')
          fi
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::没有拿到版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "将通知 MySync 同步：v${VERSION}"

      - name: Dispatch to MySync
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          # **必需**：一个能访问私密仓库 MySync 的 GitHub PAT。
          #
          # 实测过三种方式往 MySync 发 dispatch：
          #   - 匿名调用        → 401 Requires authentication
          #   - 本仓库 GITHUB_TOKEN → 404（它只能看到本仓库，看不到私密仓库）
          #   - 具备 repo 权限的 PAT → 204 ✅
          # 所以这个 Secret 不能省，删掉整个发布流程就无法通知 Gitee。
          SYNC_TOKEN: ${{ secrets.MYSYNC }}
        run: |
          if [ -z "${SYNC_TOKEN:-}" ]; then
            echo "::error::缺少 MYSYNC Secret（需要能访问 ShmilyStar/MySync 的 PAT，否则 Gitee 收不到同步通知）"
            exit 1
          fi
          echo "::add-mask::$SYNC_TOKEN"

          # 重试几次：dispatch 偶发 5xx 时不要让发布流程留下「Gitee 没同步」的尾巴。
          for i in 1 2 3 4 5; do
            CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST \
              -H "Authorization: token ${SYNC_TOKEN}" \
              -H "User-Agent: notify-mysync" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/json" \
              --data "{\"event_type\":\"yunting-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}" \
              https://api.github.com/repos/ShmilyStar/MySync/dispatches)
            echo "第 ${i} 次 dispatch -> HTTP ${CODE}"
            if [ "$CODE" = "204" ]; then
              echo "✔ 已通知 MySync 同步 v${VERSION}"
              exit 0
            fi
            cat /tmp/resp.txt || true
            sleep 10
          done
          echo "::error::通知 MySync 失败；可在 MySync 仓库手动触发同步（Gitee 不会自动更新）"
          exit 1
