name: Upload APK artifacts
description: 把构建出来的 5 个 ABI 的 APK 作为构建产物上传，供 Release 作业统一收集

runs:
  using: composite
  steps:
    - name: Upload Artifact arm64-v8a
      uses: actions/upload-artifact@v7
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-arm64-v8a-release
        path: android/app/build/outputs/apk/release/yunting-music-v${{ env.PACKAGE_VERSION }}-arm64-v8a.apk

    - name: Upload Artifact armeabi-v7a
      uses: actions/upload-artifact@v7
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-armeabi-v7a-release
        path: android/app/build/outputs/apk/release/yunting-music-v${{ env.PACKAGE_VERSION }}-armeabi-v7a.apk

    - name: Upload Artifact universal
      uses: actions/upload-artifact@v7
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-universal-release
        path: android/app/build/outputs/apk/release/yunting-music-v${{ env.PACKAGE_VERSION }}-universal.apk

    - name: Upload Artifact x86_64
      uses: actions/upload-artifact@v7
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-x86_64-release
        path: android/app/build/outputs/apk/release/yunting-music-v${{ env.PACKAGE_VERSION }}-x86_64.apk

    - name: Upload Artifact x86
      uses: actions/upload-artifact@v7
      with:
        name: app-v${{ env.PACKAGE_VERSION }}-x86-release
        path: android/app/build/outputs/apk/release/yunting-music-v${{ env.PACKAGE_VERSION }}-x86.apk
